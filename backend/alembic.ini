[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# 20260921_ab12cd34ef56_add_something.py - sorts chronologically in the file list
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
# NOTE: the database URL is intentionally NOT set here. alembic/env.py reads it
# from the app settings (DATABASE_URL), so no credentials live in this file.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
